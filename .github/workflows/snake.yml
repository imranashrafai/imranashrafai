name: Teal contribution snake

on:
  schedule:
    - cron: "0 0 * * *"   # once a day
  workflow_dispatch:       # lets you run it by hand from the Actions tab
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Build the snake SVGs from your contribution graph
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-teal.svg?palette=github-dark&color_snake=#2DD4BF&color_dots=#161B22,#0E4D47,#14806F,#1FB39C,#2DD4BF
            dist/snake-teal-light.svg?color_snake=#0F766E&color_dots=#EBEDF0,#99F6E4,#2DD4BF,#14B8A6,#0F766E

      - name: Publish them to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
